<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sahayak — Civic & Welfare AI Assistant for India</title>
  <meta name="description" content="All-India civic assistant for 28 States & 8 UTs. Find welfare schemes, election & candidate info, file grievances & RTI in all Indian languages.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <script>
    (function(){
      var originalWarn = console.warn;
      console.warn = function(){
        var args = Array.prototype.slice.call(arguments);
        if(args.some(function(a){ return typeof a === 'string' && a.indexOf('in-browser Babel transformer') !== -1; })){
          return;
        }
        originalWarn.apply(console, args);
      };
    })();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <style>
    :root{
      --saffron:#FF9933;
      --saffron-deep:#B8650A;
      --green:#128807;
      --green-deep:#0C6B05;
      --navy:#0B2158;
      --chakra:#1450A3;
      --ink:#15161F;
      --muted:#71738A;
      --bg:#F7F8FA;
      --surface:#FFFFFF;
      --surface-soft:#F0F2F6;
      --border:#E3E5ED;
      --radius-lg:20px;
      --radius-md:14px;
      --radius-sm:10px;
      --shadow-sm:0 2px 6px rgba(15,15,20,0.04);
      --shadow-md:0 16px 40px -16px rgba(15,15,20,0.14);
      --shadow-lg:0 24px 48px -12px rgba(15,15,20,0.22);
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;width:100%;height:100%;}
    #root{
      height:100vh;
      width:100vw;
      display:flex;
      position:relative;
      overflow:hidden;
    }
    .bg-blobs{position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
    .bg-blobs span{position:absolute; border-radius:50%; filter:blur(72px); opacity:0.18;}
    .bg-blobs .b1{width:460px;height:460px; background:var(--saffron); top:-160px; left:-120px;}
    .bg-blobs .b2{width:420px;height:420px; background:var(--chakra); bottom:-140px; left:260px;}
    .bg-blobs .b3{width:380px;height:380px; background:var(--green); bottom:40px; right:-120px;}

    /* ---------- Sidebar ---------- */
    .sidebar{
      width:280px; flex:0 0 auto; z-index:2;
      background:rgba(255,255,255,0.92); backdrop-filter:blur(12px);
      border-right:1px solid var(--border);
      display:flex; flex-direction:column;
      padding:16px 14px; height:100%; overflow-y:auto; overflow-x:hidden;
    }
    .brand{display:flex; align-items:center; gap:10px; padding:4px 6px 16px;}
    .brand-mark{
      width:36px; height:36px; border-radius:10px; flex:0 0 auto;
      background:linear-gradient(135deg, var(--saffron), var(--chakra));
      display:flex; align-items:center; justify-content:center; color:#fff;
      box-shadow:0 4px 12px rgba(255,153,51,0.28);
    }
    .brand-name{font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:16px; color:var(--ink); line-height:1.2; letter-spacing:-0.2px;}
    .brand-sub{font-size:11px; color:var(--muted); font-weight:500; margin-top:2px;}

    .new-chat-btn{
      display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
      padding:10px 14px; border-radius:var(--radius-sm); border:1px solid var(--border);
      background:var(--surface); font-weight:600; font-size:13px; color:var(--ink);
      cursor:pointer; margin-bottom:14px; transition:all .15s ease;
      box-shadow:var(--shadow-sm);
    }
    .new-chat-btn:hover{background:var(--surface-soft); border-color:#CBD0DD; transform:translateY(-1px);}

    .nav-label{font-size:10.5px; text-transform:uppercase; letter-spacing:0.8px; color:var(--muted); font-weight:700; padding:6px 8px 6px;}
    .nav-label.collapsible{display:flex; align-items:center; justify-content:space-between; cursor:pointer; user-select:none;}
    .nav-label.collapsible .chevron{display:flex; transition:transform .18s;}
    .nav-label.collapsible .chevron.open{transform:rotate(180deg);}
    
    .nav-item{
      display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--radius-sm);
      cursor:pointer; font-size:13px; font-weight:600; color:var(--ink); margin-bottom:3px;
      border:1px solid transparent; transition:background .12s, border-color .12s;
    }
    .nav-item:hover{background:var(--surface-soft);}
    .nav-item.active{background:var(--surface-soft); border-color:var(--border);}
    .nav-icon{width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
    .nav-icon.auto{background:linear-gradient(135deg,var(--saffron),var(--chakra)); color:#fff;}
    .nav-icon.scheme{background:rgba(18,136,7,0.12); color:var(--green);}
    .nav-icon.voter{background:rgba(11,33,88,0.1); color:var(--navy);}
    .nav-icon.grievance{background:rgba(255,153,51,0.16); color:var(--saffron-deep);}
    .nav-icon.portals{background:rgba(20,80,163,0.12); color:var(--chakra);}
    .nav-item-meta{display:flex; flex-direction:column; line-height:1.25;}
    .nav-item-sub{font-size:10.5px; font-weight:400; color:var(--muted); margin-top:2px;}

    .recent-list{display:flex; flex-direction:column; gap:2px; margin-bottom:8px; max-height:220px; overflow-y:auto; overflow-x:hidden;}
    .recent-item{
      display:flex; align-items:center; justify-content:space-between;
      padding:7px 10px; border-radius:var(--radius-sm); font-size:12px; color:var(--muted); cursor:pointer;
      transition:all .12s; position:relative;
    }
    .recent-item:hover{background:var(--surface-soft); color:var(--ink);}
    .recent-item.active{background:var(--surface-soft); color:var(--ink); font-weight:600;}
    .recent-title{
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0;
    }
    .delete-chat-btn{
      background:none; border:none; color:var(--muted); cursor:pointer; padding:2px 4px;
      border-radius:4px; display:none; align-items:center; justify-content:center;
      margin-left:6px; opacity:0.7; transition:all .1s;
    }
    .delete-chat-btn:hover{color:#E53935; opacity:1; background:rgba(229,57,53,0.1);}
    .recent-item:hover .delete-chat-btn{display:flex;}

    .sidebar-footer{margin-top:auto; padding-top:12px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:6px;}
    .sidebar-powered{
      font-size:11px; font-weight:600; color:var(--ink); text-align:center;
      display:flex; align-items:center; justify-content:center; gap:5px;
      padding:5px 8px; border-radius:6px; background:var(--surface-soft);
      border:1px solid var(--border); letter-spacing:0.2px;
    }
    .sidebar-powered strong{color:var(--chakra); font-weight:800;}
    .sidebar-disclaimer{font-size:10px; color:var(--muted); line-height:1.4; text-align:center;}

    .powered-badge{
      display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600;
      color:var(--muted); background:var(--surface-soft); border:1px solid var(--border);
      padding:4px 12px; border-radius:999px; margin-bottom:14px;
    }
    .powered-badge strong{color:var(--ink); font-weight:700;}

    /* ---------- Main ---------- */
    .main{flex:1; display:flex; flex-direction:column; min-width:0; z-index:1; position:relative; height:100%; overflow:hidden;}
    .topbar{
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 32px; border-bottom:1px solid var(--border);
      background:rgba(247,248,250,0.85); backdrop-filter:blur(10px); gap:12px; flex-wrap:wrap;
    }
    .topbar-left{display:flex; align-items:center; gap:12px;}
    .topbar-right{display:flex; align-items:center; gap:10px;}

    .mode{display:flex; align-items:center; gap:9px; font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:14.5px;}
    .mode-icon{width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#fff;}
    
    .select-dropdown{
      display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border);
      border-radius:999px; padding:6px 12px; font-size:12px; font-weight:600; color:var(--ink);
      cursor:pointer; outline:none; transition:border-color .15s;
    }
    .select-dropdown:hover{border-color:var(--chakra);}
    .select-dropdown select{border:none; outline:none; background:transparent; font-size:12px; font-weight:600; color:var(--ink); cursor:pointer;}

    .status-pill{
      display:flex; align-items:center; gap:6px; font-size:11px; font-weight:600; color:var(--green-deep);
      background:rgba(18,136,7,0.1); padding:6px 12px; border-radius:999px; border:1px solid rgba(18,136,7,0.15);
    }
    .status-dot{width:6.5px; height:6.5px; border-radius:50%; background:var(--green); animation:pulse 1.8s infinite;}
    @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.35;}}

    .chat-scroll{flex:1; overflow-y:auto; overflow-x:hidden; padding:16px 0 6px; scroll-behavior:smooth;}
    .chat-inner{width:100%; max-width:1300px; margin:0 auto; padding:0 32px; display:flex; flex-direction:column; gap:14px;}

    /* ---------- Browse by Category ---------- */
    .browse-inner{width:100%; max-width:1300px; margin:0 auto; padding:8px 32px;}
    .browse-heading{text-align:center; margin-bottom:16px;}
    .browse-heading h2{font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:23px; margin:0 0 6px; color:var(--ink);}
    .browse-heading p{font-size:13.5px; color:var(--muted); margin:0;}
    
    .browse-filter-row{display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:20px; flex-wrap:wrap;}
    .filter-pill{
      display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:999px;
      border:1px solid var(--border); background:var(--surface); color:var(--muted);
      font-size:12px; font-weight:600; cursor:pointer; transition:all .15s ease;
    }
    .filter-pill:hover{border-color:var(--chakra); color:var(--ink); transform:translateY(-1px);}
    .filter-pill.active{background:var(--ink); color:#fff; border-color:var(--ink); box-shadow:var(--shadow-sm);}
    .filter-pill.scheme.active{background:var(--green); border-color:var(--green);}
    .filter-pill.identity.active{background:#0D7C66; border-color:#0D7C66;}
    .filter-pill.rto.active{background:var(--chakra); border-color:var(--chakra);}
    .filter-pill.eseva.active{background:#8E44AD; border-color:#8E44AD;}
    .filter-pill.worktax.active{background:#2E5B88; border-color:#2E5B88;}
    .filter-pill.voter.active{background:var(--navy); border-color:var(--navy);}
    .filter-pill.grievance.active{background:var(--saffron-deep); border-color:var(--saffron-deep);}

    .category-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:12px;}
    .category-card{
      border:1px solid var(--border); border-radius:var(--radius-md); padding:16px;
      background:var(--surface); cursor:pointer; transition:all .18s ease;
      box-shadow:var(--shadow-sm); display:flex; flex-direction:column;
    }
    .category-card:hover{border-color:var(--chakra); box-shadow:var(--shadow-md); transform:translateY(-2px);}
    .category-card-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
    .category-icon{
      width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    }
    .category-icon.scheme{background:rgba(18,136,7,0.12); color:var(--green);}
    .category-icon.identity{background:rgba(13,124,102,0.12); color:#0D7C66;}
    .category-icon.rto{background:rgba(20,80,163,0.12); color:var(--chakra);}
    .category-icon.eseva{background:rgba(142,68,173,0.12); color:#8E44AD;}
    .category-icon.worktax{background:rgba(46,91,136,0.12); color:#2E5B88;}
    .category-icon.voter{background:rgba(11,33,88,0.1); color:var(--navy);}
    .category-icon.grievance{background:rgba(255,153,51,0.16); color:var(--saffron-deep);}
    .category-badge{
      font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.4px;
      padding:3px 8px; border-radius:999px;
    }
    .category-badge.scheme{background:rgba(18,136,7,0.1); color:var(--green-deep);}
    .category-badge.identity{background:rgba(13,124,102,0.1); color:#0D7C66;}
    .category-badge.rto{background:rgba(20,80,163,0.1); color:var(--chakra);}
    .category-badge.eseva{background:rgba(142,68,173,0.1); color:#8E44AD;}
    .category-badge.worktax{background:rgba(46,91,136,0.1); color:#2E5B88;}
    .category-badge.voter{background:rgba(11,33,88,0.08); color:var(--navy);}
    .category-badge.grievance{background:rgba(255,153,51,0.15); color:var(--saffron-deep);}
    .category-label{font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:14px; margin-bottom:4px; color:var(--ink);}
    .category-blurb{font-size:12px; color:var(--muted); line-height:1.4;}

    /* ---------- State Directory View ---------- */
    .directory-container{width:100%; max-width:1300px; margin:0 auto; padding:8px 32px;}
    .directory-hero{
      background:linear-gradient(135deg, #0B2158 0%, #1450A3 100%);
      color:#fff; border-radius:var(--radius-lg); padding:22px 28px; margin-bottom:18px;
      display:flex; align-items:center; justify-content:space-between; gap:20px; box-shadow:var(--shadow-md);
    }
    .directory-hero h2{font-family:'Plus Jakarta Sans',sans-serif; font-size:22px; margin:0 0 6px; font-weight:800;}
    .directory-hero p{font-size:13px; opacity:0.88; margin:0; line-height:1.5;}
    .state-cards-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(310px, 1fr)); gap:14px;}
    .state-card{
      background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
      padding:16px 18px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:10px;
      transition:all .15s;
    }
    .state-card:hover{border-color:var(--chakra); transform:translateY(-1px);}
    .state-card-header{display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--surface-soft); padding-bottom:8px;}
    .state-card-title{font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:14.5px; color:var(--ink);}
    .state-badge{font-size:10px; font-weight:700; padding:2px 7px; border-radius:999px; background:rgba(20,80,163,0.1); color:var(--chakra);}
    .state-links{display:flex; flex-direction:column; gap:6px; font-size:12px;}
    .state-link-row{display:flex; align-items:center; justify-content:space-between; color:var(--muted);}
    .state-link-row a{color:var(--chakra); font-weight:600; text-decoration:none; display:flex; align-items:center; gap:4px;}
    .state-link-row a:hover{text-decoration:underline;}
    .helpline-chip{background:rgba(255,153,51,0.12); color:var(--saffron-deep); font-weight:700; padding:2px 6px; border-radius:6px; font-size:11px;}

    /* ---------- Chat Message Cards ---------- */
    @keyframes rise{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
    .msg{display:flex; gap:12px; animation:rise .22s ease; width:100%;}
    .msg.user{flex-direction:row-reverse;}
    .msg-avatar{width:32px; height:32px; border-radius:10px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:13px;}
    .msg-avatar.user{background:var(--ink);}
    .msg-avatar.scheme{background:var(--green);}
    .msg-avatar.voter{background:var(--navy);}
    .msg-avatar.grievance{background:var(--saffron);}
    .msg-avatar.auto{background:linear-gradient(135deg,var(--saffron),var(--chakra));}

    .msg-card{
      width:100%; background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius-md); border-bottom-left-radius:4px;
      padding:15px 20px; font-size:14px; line-height:1.62; box-shadow:var(--shadow-sm);
    }
    .msg.user .msg-card{
      width:auto; max-width:80%; background:var(--ink); color:#fff;
      border-color:var(--ink); border-bottom-left-radius:var(--radius-md); border-bottom-right-radius:4px;
    }
    .msg-card p{margin:0 0 8px;} .msg-card p:last-child{margin:0;}
    .msg-card h1,.msg-card h2,.msg-card h3{font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; margin:12px 0 6px; color:var(--ink); font-size:15px;}
    .msg-card h1:first-child,.msg-card h2:first-child,.msg-card h3:first-child{margin-top:0;}
    .msg-card table{width:100%; border-collapse:collapse; margin:10px 0; font-size:13px;}
    .msg-card th, .msg-card td{border:1px solid var(--border); padding:7px 9px; text-align:left;}
    .msg-card ul{margin:8px 0; padding-left:20px;}
    .msg-card ul li{margin-bottom:5px; line-height:1.58;}
    .msg-card ol{
      list-style:none; counter-reset:step; margin:10px 0; padding-left:0;
      display:flex; flex-direction:column; gap:10px;
    }
    .msg-card ol > li{
      counter-increment:step; position:relative; padding-left:32px;
      margin-bottom:0; font-size:14px; line-height:1.6;
    }
    .msg-card ol > li::before{
      content:counter(step); position:absolute; left:0; top:2px;
      width:22px; height:22px; border-radius:50%;
      background:linear-gradient(135deg,var(--saffron),var(--chakra)); color:#fff;
      font-size:11.5px; font-weight:800; font-family:'Inter',sans-serif;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 2px 6px rgba(20,80,163,0.22);
    }
    .msg-card ol > li > p{margin:0 0 4px;}
    .msg-card ol > li > p:last-child{margin-bottom:0;}
    .msg-card ol > li > ul{margin:4px 0 6px; padding-left:18px;}
    .msg-card strong{color:var(--ink); font-weight:700;}
    .msg.user .msg-card strong{color:#fff;}
    .msg-card a{color:var(--chakra); font-weight:600; text-decoration:none;}
    .msg-card a:hover{text-decoration:underline;}
    .msg-card code{background:var(--surface-soft); padding:1px 6px; border-radius:4px; font-family:'IBM Plex Mono',monospace; font-size:12px;}

    .msg-card-top{display:flex; align-items:center; margin-bottom:6px;}
    .msg-card-bottom{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      margin-top:10px; padding-top:8px; border-top:1px solid var(--border); flex-wrap:wrap;
    }
    .agent-label{
      display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:800;
      letter-spacing:0.3px; text-transform:uppercase; padding:3px 10px; border-radius:999px;
    }
    .agent-label.scheme{background:rgba(18,136,7,0.1); color:var(--green-deep);}
    .agent-label.voter{background:rgba(11,33,88,0.08); color:var(--navy);}
    .agent-label.grievance{background:rgba(255,153,51,0.15); color:var(--saffron-deep);}

    .sources-row{display:flex; flex-wrap:wrap; gap:6px; flex:1; min-width:0;}
    .source-chip{
      font-size:11px; font-weight:600; padding:4px 10px; border-radius:999px;
      background:var(--surface-soft); color:var(--chakra); text-decoration:none; border:1px solid var(--border);
      max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; transition:all .12s;
    }
    .source-chip:hover{border-color:var(--chakra); background:#fff;}

    .picker-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
    .picker-row button{
      display:flex; align-items:center; gap:6px; font-family:'Inter',sans-serif; font-weight:700; font-size:12px;
      padding:8px 14px; border-radius:999px; cursor:pointer; border:1px solid var(--border); background:var(--surface);
      transition:all .15s;
    }
    .picker-row button.scheme{color:var(--green-deep);}
    .picker-row button.voter{color:var(--navy);}
    .picker-row button.grievance{color:var(--saffron-deep);}
    .picker-row button:hover{border-color:currentColor; transform:translateY(-1px);}

    .typing-card{display:inline-flex; gap:6px; padding:14px 18px; border-radius:var(--radius-md); border-bottom-left-radius:4px; background:var(--surface); border:1px solid var(--border);}
    .typing-dot{width:7px; height:7px; border-radius:50%; background:var(--muted); animation:bounce 1.2s infinite ease-in-out;}
    .typing-dot:nth-child(2){animation-delay:0.15s;}
    .typing-dot:nth-child(3){animation-delay:0.3s;}
    @keyframes bounce{0%,80%,100%{transform:translateY(0); opacity:0.4;} 40%{transform:translateY(-5px); opacity:1;}}

    /* ---------- Empty State Suggestions ---------- */
    .empty-state{margin:32px auto; text-align:center; max-width:900px; width:100%;}
    .empty-icon{
      width:58px; height:58px; border-radius:18px; margin:0 auto 16px;
      background:linear-gradient(135deg,var(--saffron),var(--chakra));
      display:flex; align-items:center; justify-content:center; color:#fff;
      box-shadow:0 8px 20px rgba(20,80,163,0.22);
    }
    .empty-state h2{font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:22px; margin:0 0 8px; color:var(--ink);}
    .empty-state p{font-size:13.5px; line-height:1.6; color:var(--muted); margin:0 0 22px;}
    .suggestion-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:12px; text-align:left;}
    .suggestion-card{
      border:1px solid var(--border); border-radius:var(--radius-md); padding:13px 14px;
      cursor:pointer; background:var(--surface); font-size:12.5px; line-height:1.5; color:var(--ink);
      transition:all .15s ease; box-shadow:var(--shadow-sm);
    }
    .suggestion-card:hover{border-color:var(--chakra); box-shadow:var(--shadow-md); transform:translateY(-1px);}
    .suggestion-tag{font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; display:block;}
    .suggestion-tag.scheme{color:var(--green);}
    .suggestion-tag.voter{color:var(--navy);}
    .suggestion-tag.grievance{color:var(--saffron-deep);}

    /* ---------- Composer ---------- */
    .composer{padding:10px 32px 18px; background:linear-gradient(to top, var(--bg) 70%, transparent); width:100%;}
    .composer-inner{width:100%; max-width:1300px; margin:0 auto;}
    .input-shell{
      display:flex; align-items:flex-end; gap:8px; background:var(--surface);
      border:1px solid var(--border); border-radius:26px; padding:8px 12px; box-shadow:var(--shadow-md);
      transition:border-color .15s, box-shadow .15s;
    }
    .input-shell:focus-within{border-color:var(--chakra); box-shadow:0 8px 24px rgba(20,80,163,0.15);}
    .input-shell textarea{
      flex:1; resize:none; border:none; outline:none; background:transparent;
      font-family:'Inter',sans-serif; font-size:14px; line-height:1.5; color:var(--ink);
      padding:9px 6px; min-height:24px; max-height:130px;
    }
    .mic-btn{
      width:40px; height:40px; border-radius:50%; flex:0 0 auto; border:1px solid var(--border); cursor:pointer;
      background:var(--surface-soft); color:var(--muted);
      display:flex; align-items:center; justify-content:center; transition:all .15s;
    }
    .mic-btn:hover:not(:disabled){color:var(--chakra); border-color:var(--chakra); background:#fff;}
    .mic-btn.listening{background:var(--saffron); color:#fff; border-color:var(--saffron); animation:mic-pulse 1.4s infinite;}
    .mic-btn:disabled{opacity:0.3; cursor:not-allowed;}
    .mic-error{
      display:flex; align-items:flex-start; gap:8px; justify-content:space-between;
      background:#FFF3E0; color:var(--saffron-deep); border:1px solid #FFD9A8;
      border-radius:var(--radius-sm); padding:9px 12px; font-size:12px; line-height:1.5; margin-bottom:8px;
    }
    .mic-error button{background:none; border:none; color:var(--saffron-deep); cursor:pointer; flex:0 0 auto; padding:2px;}
    @keyframes mic-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,153,51,0.4);} 50%{box-shadow:0 0 0 8px rgba(255,153,51,0);}}
    .send-btn{
      width:40px; height:40px; border-radius:50%; flex:0 0 auto; border:none; cursor:pointer;
      background:linear-gradient(135deg,var(--saffron),var(--chakra)); color:#fff;
      display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px rgba(20,80,163,0.28);
      transition:all .15s ease;
    }
    .send-btn:hover:not(:disabled){transform:scale(1.04); box-shadow:0 8px 20px rgba(20,80,163,0.38);}
    .send-btn:disabled{opacity:0.35; cursor:not-allowed; box-shadow:none; transform:none;}

    .composer-actions{
      display:flex; align-items:center; gap:6px; flex:0 0 auto;
    }
    .action-icon-btn{
      width:38px; height:38px; border-radius:50%; flex:0 0 auto; border:1px solid var(--border);
      background:var(--surface-soft); color:var(--muted); cursor:pointer;
      display:flex; align-items:center; justify-content:center; transition:all .16s ease;
    }
    .action-icon-btn:hover:not(:disabled){
      color:var(--chakra); border-color:var(--chakra); background:#fff; transform:scale(1.05);
    }
    .action-icon-btn.live-active{
      background:linear-gradient(135deg, #E53935, #C62828); color:#fff; border-color:#C62828;
      box-shadow:0 0 12px rgba(229,57,53,0.45); animation:pulse-live 1.6s infinite;
    }
    .action-icon-btn.auto-speak-active{
      background:rgba(20,80,163,0.1); color:var(--chakra); border-color:var(--chakra);
    }
    .action-icon-btn.auto-speak-muted{
      color:var(--muted); opacity:0.6; background:var(--surface-soft);
    }
    .live-dot-pulse{
      width:7px; height:7px; border-radius:50%; background:#fff; display:inline-block;
      box-shadow:0 0 6px #fff; animation:dot-flash 1s infinite alternate;
    }
    @keyframes dot-flash{from{opacity:0.3;} to{opacity:1;}}
    @keyframes pulse-live{
      0%{box-shadow:0 0 0 0 rgba(229,57,53,0.6);}
      70%{box-shadow:0 0 0 8px rgba(229,57,53,0);}
      100%{box-shadow:0 0 0 0 rgba(229,57,53,0);}
    }

    .msg-actions-row{
      margin-left:auto; display:inline-flex; align-items:center; gap:6px; flex:0 0 auto;
    }
    .card-action-btn{
      display:inline-flex; align-items:center; gap:4px;
      padding:5px 10px; border-radius:999px; border:1px solid var(--border);
      background:var(--surface-soft); color:var(--muted); font-size:11px; font-weight:600;
      cursor:pointer; flex:0 0 auto; transition:all .15s ease;
    }
    .card-action-btn:hover{color:var(--chakra); border-color:var(--chakra); background:#fff; transform:translateY(-1px); box-shadow:var(--shadow-sm);}
    .card-action-btn.copied{background:rgba(18,136,7,0.12); color:var(--green); border-color:var(--green);}

    .speak-btn{
      display:inline-flex; align-items:center; gap:5px;
      padding:5px 11px; border-radius:999px; border:1px solid var(--border);
      background:var(--surface-soft); color:var(--muted); font-size:11px; font-weight:600;
      cursor:pointer; flex:0 0 auto; transition:all .15s ease;
    }
    .speak-btn:hover{color:var(--chakra); border-color:var(--chakra); background:#fff; transform:translateY(-1px); box-shadow:var(--shadow-sm);}
    .speak-btn.speaking{background:rgba(255,153,51,0.16); color:var(--saffron-deep); border-color:var(--saffron);}

    .mobile-menu-btn{
      display:none; width:34px; height:34px; border-radius:8px; border:1px solid var(--border);
      background:var(--surface); color:var(--ink); cursor:pointer; align-items:center; justify-content:center;
      transition:all .15s ease;
    }
    .mobile-menu-btn:hover{border-color:var(--chakra); color:var(--chakra);}
    .sidebar-backdrop{
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:90;
      backdrop-filter:blur(2px);
    }

    ::-webkit-scrollbar{width:7px;}
    ::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
    
    @media(max-width:768px){
      .sidebar{
        display:none; position:fixed; top:0; left:0; bottom:0; width:280px; z-index:100;
        box-shadow:var(--shadow-lg);
      }
      .sidebar.mobile-open{display:flex; animation:slide-in .2s ease;}
      .sidebar-backdrop.mobile-open{display:block;}
      .mobile-menu-btn{display:inline-flex;}
      .category-grid{grid-template-columns:1fr;}
      .topbar{padding:10px 14px; gap:8px;}
      .chat-inner, .browse-inner, .directory-container, .composer{padding-left:12px; padding-right:12px;}
    }
    @keyframes slide-in{from{transform:translateX(-100%);} to{transform:translateX(0);}}
  </style>
</head>

function routeAgent(text){
  const t = text.toLowerCase();
  let s = 0, v = 0, g = 0;
  SCHEME_KEYWORDS.forEach(k=>{ if(t.includes(k)) s++; });
  VOTER_KEYWORDS.forEach(k=>{ if(t.includes(k)) v++; });
  GRIEVANCE_KEYWORDS.forEach(k=>{ if(t.includes(k)) g++; });
  if(s === 0 && v === 0 && g === 0) return null;
  if(g >= s && g >= v) return 'grievance';
  return s >= v ? 'scheme' : 'voter';
}

  return text.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
}

function renderMarkdown(text){
  const clean = cleanThinkingTags(text);
  if(typeof marked !== 'undefined' && marked.parse){
    try {
      const raw = marked.parse(clean || '');
      if(typeof DOMPurify !== 'undefined' && DOMPurify.sanitize){
        return { __html: DOMPurify.sanitize(raw) };
      }
      return { __html: raw };
    } catch(e){}
  }
  return { __html: (clean || '').replace(/\n/g, '<br/>') };
}

   5. MULTI-PROVIDER & MULTI-MODEL AUTO-FAILOVER ENGINE
   ========================================================================== */
async function callProviderAPI(provider, key, model, systemPrompt, userHistory){
  const messages = [
    { role: 'system', content: systemPrompt },
    ...userHistory
  ];

  if(provider === 'groq'){
    const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${key.trim()}`
      },
      body: JSON.stringify({
        model: model,
        messages: messages,
        temperature: 0.3,
        max_tokens: 800
      })
    });
    if(!resp.ok){
      const err = await resp.json().catch(()=>({}));
      throw new Error(err.error?.message || `HTTP ${resp.status}`);
    }
    const data = await resp.json();
    return data.choices[0]?.message?.content || '';
  }

  if(provider === 'nvidia'){
    const resp = await fetch('https://integrate.api.nvidia.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${key.trim()}`
      },
      body: JSON.stringify({
        model: model,
        messages: messages,
        temperature: 0.3,
        max_tokens: 800
      })
    });
    if(!resp.ok){
      const err = await resp.json().catch(()=>({}));
      throw new Error(err.error?.message || `HTTP ${resp.status}`);
    }
    const data = await resp.json();
    return data.choices[0]?.message?.content || '';
  }

  if(provider === 'openrouter'){
    const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${key.trim()}`,
        'HTTP-Referer': window.location.origin || 'https://sahayak.app',
        'X-Title': 'Sahayak Civic Assistant'
      },
      body: JSON.stringify({
        model: model,
        messages: messages,
        temperature: 0.3,
        max_tokens: 800
      })
    });
    if(!resp.ok){
      const err = await resp.json().catch(()=>({}));
      throw new Error(err.error?.message || `HTTP ${resp.status}`);
    }
    const data = await resp.json();
    return data.choices[0]?.message?.content || '';
  }

  if(provider === 'gemini'){
    const cleanModel = model || 'gemini-2.0-flash';
    const contents = [];
    userHistory.forEach(m => {
      const role = m.role === 'assistant' ? 'model' : 'user';
      if(contents.length > 0 && contents[contents.length - 1].role === role){
        contents[contents.length - 1].parts[0].text += `\n\n${m.content}`;
      } else {
        contents.push({ role, parts: [{ text: m.content }] });
      }
    });
    if(contents.length === 0 || contents[0].role !== 'user'){
      contents.unshift({ role: 'user', parts: [{ text: 'Hello' }] });
    }

    const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${cleanModel}:generateContent?key=${key.trim()}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: systemPrompt }] },
        contents: contents,
        generationConfig: { maxOutputTokens: 800, temperature: 0.3 }
      })
    });
    if(!resp.ok){
      const err = await resp.json().catch(()=>({}));
      throw new Error(err.error?.message || `HTTP ${resp.status}`);
    }
    const data = await resp.json();
    return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
  }

  if(provider === 'openai' || provider === 'grok' || provider === 'deepseek'){
    const endpoints = {
      openai: 'https://api.openai.com/v1/chat/completions',
      grok: 'https://api.x.ai/v1/chat/completions',
      deepseek: 'https://api.deepseek.com/v1/chat/completions'
    };
    const resp = await fetch(endpoints[provider], {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${key.trim()}`
      },
      body: JSON.stringify({
        model: model,
        messages: messages,
        temperature: 0.3,
        max_tokens: 800
      })
    });
    if(!resp.ok){
      const err = await resp.json().catch(()=>({}));
      throw new Error(err.error?.message || `HTTP ${resp.status}`);
    }
    const data = await resp.json();
    return data.choices[0]?.message?.content || '';
  }

  if(provider === 'claude'){
    const normalizedHistory = [];
    userHistory.forEach(m => {
      const role = m.role === 'assistant' ? 'assistant' : 'user';
      if(normalizedHistory.length > 0 && normalizedHistory[normalizedHistory.length - 1].role === role){
        normalizedHistory[normalizedHistory.length - 1].content += `\n\n${m.content}`;
      } else {
        normalizedHistory.push({ role, content: m.content });
      }
    });
    if(normalizedHistory.length === 0 || normalizedHistory[0].role !== 'user'){
      normalizedHistory.unshift({ role: 'user', content: 'Hello' });
    }

    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key.trim(),
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: model || 'claude-3-7-sonnet-20250219',
        system: systemPrompt,
        messages: normalizedHistory,
        max_tokens: 800
      })
    });
    if(!resp.ok){
      const err = await resp.json().catch(()=>({}));
      throw new Error(err.error?.message || `HTTP ${resp.status}`);
    }
    const data = await resp.json();
    return data.content?.[0]?.text || '';
  }

  throw new Error(`Unknown provider: ${provider}`);
}

function extractCitations(text, stateObj){
  const citations = [];
  const domainRegex = /(https?:\/\/[^\s\)\>\]"'`]+)/gi;
  const matches = text.match(domainRegex) || [];
  const seen = new Set();
  matches.forEach(rawUrl => {
    let cleanUrl = rawUrl.replace(/[,\.\)\*\>\]"':]+$/, '').trim();
    if(!seen.has(cleanUrl) && cleanUrl.startsWith('http')){
      seen.add(cleanUrl);
      try{
        const parsed = new URL(cleanUrl);
        if(parsed.hostname && parsed.hostname.includes('.')){
          citations.push({ url: cleanUrl, title: parsed.hostname });
        }
      }catch(e){}
    }
  });

  if(citations.length === 0 && stateObj){
    citations.push({ url: `https://${stateObj.grievancePortal}`, title: `${stateObj.name} Grievance Portal` });
    citations.push({ url: `https://${stateObj.schemesPortal}`, title: `${stateObj.name} Citizen Services` });
  }
  return citations;
}

    const pool = langMatches.length > 0 ? langMatches : voices;

    if(genderPref === 'female'){
      const femaleKeywords = ['female', 'woman', 'swara', 'heera', 'neerja', 'kalpana', 'zira', 'jenny', 'samantha', 'victoria', 'google'];
      const femVoice = pool.find(v => femaleKeywords.some(k => v.name.toLowerCase().includes(k)));
      if(femVoice) return femVoice;
    } else if(genderPref === 'male'){
      const maleKeywords = ['male', 'man', 'ravi', 'rishi', 'hemant', 'david', 'george', 'mark'];
      const maleVoice = pool.find(v => maleKeywords.some(k => v.name.toLowerCase().includes(k)));
      if(maleVoice) return maleVoice;
    }

    return pool[0] || null;
  }

  const speechRecSupported = typeof window !== 'undefined' && !!(window.SpeechRecognition || window.webkitSpeechRecognition);

  function detectStateInText(text, currentStateCode){
    if(!text) return currentStateCode;
    const t = text.toLowerCase();
    for(const s of STATES_DIRECTORY){
      if(s.code !== 'ALL' && (t.includes(s.name.toLowerCase()) || t.includes(`in ${s.code.toLowerCase()}`))){
        return s.code;
      }
    }
    return currentStateCode;
  }

  /* Multi-Key & Multi-Model Dispatcher with True Multi-Turn Context & Auto-Failover */
  async function dispatchLLM(agentType, userText, priorMessages = []){
    const historyTurns = priorMessages.map(m => ({
      role: m.who === 'user' ? 'user' : 'assistant',
      content: m.text
    }));
    const newHistory = [...historyTurns, { role:'user', content: userText }];

    // Auto-detect state if explicitly mentioned by user in the query
    const effectiveState = detectStateInText(userText, selectedState);
    const systemPrompt = getSystemPrompt(agentType, effectiveState, selectedLang);
    const stateObj = STATES_DIRECTORY.find(s => s.code === effectiveState) || STATES_DIRECTORY[0];

    // Call secure Serverless Backend (/api/chat)
    const provList = ['groq', 'nvidia', 'openrouter', 'gemini'];
    for(const prov of provList){
      try {
        const sResp = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            provider: prov,
            systemPrompt: systemPrompt,
            messages: newHistory
          })
        });
        const sData = await sResp.json().catch(()=>({}));
        if(sData && sData.text){
          const cleanedText = cleanThinkingTags(sData.text);
          const citations = extractCitations(cleanedText, stateObj);
          return { text: cleanedText, citations };
        }
      } catch(e){}
    }

    return {
      text: "The civic assistance engine is currently experiencing high network volume. Please try again in a moment.",
      citations: []
    };
  }

  async function sendText(rawText, overrideAgent){
    const text = rawText.trim();
    if(!text || loading) return;
    setView('chat');

    let agentType = overrideAgent;
    if(!agentType){
      const routed = routeAgent(text);
      if(routed){
        agentType = routed;
      } else if(messages.length > 0){
        const lastAgentMsg = [...messages].reverse().find(m => m.who === 'agent');
        agentType = lastAgentMsg?.agent || 'scheme';
      } else {
        agentType = 'scheme';
      }
    }

    const priorSnapshot = [...messages];
    setMessages(prev => [...prev, { who:'user', text }]);
    setInput('');
    setPending(null);

    setLoading(true);
    const result = await dispatchLLM(agentType, text, priorSnapshot);
    setMessages(prev => [...prev, { who:'agent', agent: agentType, text: result.text, citations: result.citations }]);
    setLoading(false);
  }

    const customizedPrompt = `${cat.prompt} Focus specifically on programs available for citizens in ${stateObj.name} and Central Government.`;
    sendText(customizedPrompt, cat.agent || 'scheme');

    setSessions(prev => {

      const updated = { id: currentSessionId, title, messages, histories, updatedAt: Date.now() };
      if (idx >= 0) {

        copy[idx] = updated;
        return copy;
      }
      return [updated, ...prev];

  /* ==========================================================================
     LIVE VOICE CONVERSATION ENGINE (HANDS-FREE DUPLEX LOOP)
     ========================================================================== */
  function stripForSpeech(text){
    return (text || '')
      .replace(/```[\s\S]*?```/g, ' ')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
      .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
      .replace(/[*_#>~-]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function stopLiveVoice(){
    setLiveVoiceActive(false);
    liveVoiceRef.current = false;
    setLiveVoiceStatus('idle');
    setListening(false);
    if(recognitionRef.current){
      try { recognitionRef.current.abort(); } catch(e){}
    }
    if(window.speechSynthesis){
      window.speechSynthesis.cancel();
    }
    setSpeakingIndex(null);
  }

  function startLiveVoice(){
    if(!speechRecSupported){
      alert("Voice recognition is not supported in this browser. Please use Google Chrome or Microsoft Edge.");
      return;
    }
    setView('chat');
    setLiveVoiceActive(true);
    liveVoiceRef.current = true;
    setLiveVoiceStatus('listening');
    listenForLiveVoice();
  }

  function listenForLiveVoice(){
    if(!liveVoiceRef.current) return;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SpeechRecognition) return;

    if(window.speechSynthesis) window.speechSynthesis.cancel();
    setSpeakingIndex(null);

    const langObj = LANGUAGES.find(l => l.code === selectedLang) || LANGUAGES[0];
    const recognition = new SpeechRecognition();
    recognition.lang = langObj.speechCode || 'en-IN';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      setListening(true);
      setLiveVoiceStatus('listening');
      setMicError(null);
    };

    recognition.onresult = (e) => {
      const transcript = (e.results[0]?.[0]?.transcript || '').trim();
      if(!transcript) return;
      
      const stopWords = ['stop', 'end', 'exit', 'cancel', 'stop voice', 'stop listening', 'रुको', 'बंद करो', 'समाप्त', 'खत्म करो', 'थांब', 'நிறுத்து', 'ఆపు', 'നിർത്തുക'];
      const isStop = stopWords.some(w => transcript.toLowerCase().includes(w));
      
      if(isStop){
        stopLiveVoice();
        return;
      }

      handleLiveVoiceInput(transcript);
    };

    recognition.onerror = (e) => {
      setListening(false);
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        setMicError("Microphone access blocked. Please allow mic permission in browser address bar.");
        stopLiveVoice();
      } else if((e.error === 'no-speech' || e.error === 'network') && liveVoiceRef.current){
        // Automatically keep listening if user paused or no speech detected yet
        setTimeout(()=>{
          if(liveVoiceRef.current && !window.speechSynthesis?.speaking) listenForLiveVoice();
        }, 500);
      }
    };

    recognition.onend = () => {
      setListening(false);
    };

    recognitionRef.current = recognition;
    try {
      recognition.start();
    } catch(e){}
  }

  async function handleLiveVoiceInput(rawText){
    let userText = (rawText || '').trim();
    if(!userText) return;

    // Wake word detection & greeting handling
    const wakePhrases = [
      'hi sahayak', 'hello sahayak', 'hey sahayak', 'namaste sahayak', 'sun sahayak', 'suno sahayak',
      'नमस्ते सहायक', 'सुनो सहायक', 'हाय सहायक', 'हेलो सहायक'
    ];

    let isOnlyWakeWord = false;
    for(const wp of wakePhrases){
      if(userText.toLowerCase() === wp || userText.toLowerCase() === 'sahayak' || userText === 'सहायक'){
        isOnlyWakeWord = true;
        break;
      }
      if(userText.toLowerCase().startsWith(wp)){
        userText = userText.slice(wp.length).replace(/^[,.:\s]+/, '').trim();
        break;
      }
    }

    setView('chat');

    // If citizen just said "Hi Sahayak" / greeting
    if(isOnlyWakeWord || !userText){
      const greeting = selectedLang === 'hi' 
        ? "नमस्ते! मैं सहायक हूँ। बताइए आज मैं आपकी क्या सहायता करूँ?" 
        : "Namaste! I am Sahayak, your civic assistant. How can I help you today?";
      setMessages(prev => [
        ...prev, 
        { who:'user', text: rawText },
        { who:'agent', agent: 'auto', text: greeting, citations: [] }
      ]);

      if(liveVoiceRef.current && autoSpeak && speechSupported){
        setLiveVoiceStatus('speaking');
        speakLiveResponse(greeting);
      } else if(liveVoiceRef.current){
        setLiveVoiceStatus('listening');
        setTimeout(()=>{
          if(liveVoiceRef.current) listenForLiveVoice();
        }, 500);
      }
      return;
    }

    let agentType = tab === 'auto' 
      ? (routeAgent(userText) || (messages.length > 0 ? (([...messages].reverse().find(m => m.who === 'agent')?.agent) || 'scheme') : 'scheme')) 
      : tab;

    const priorSnapshot = [...messages];
    setMessages(prev => [...prev, { who:'user', text: userText }]);
    setPending(null);
    setLiveVoiceStatus('thinking');

    setLoading(true);
    const result = await dispatchLLM(agentType, userText, priorSnapshot);
    const newAgentMsg = { who:'agent', agent: agentType, text: result.text, citations: result.citations };
    setMessages(prev => [...prev, newAgentMsg]);
    setLoading(false);

    // If autoSpeak is enabled, read the response aloud completely and then re-arm mic.
    // If autoSpeak is disabled, do NOT read response, and immediately listen for user's next input!
    if(liveVoiceRef.current){
      if(autoSpeak && speechSupported){
        setLiveVoiceStatus('speaking');
        speakLiveResponse(result.text);
      } else {
        setLiveVoiceStatus('listening');
        setTimeout(()=>{
          if(liveVoiceRef.current) listenForLiveVoice();
        }, 600);
      }
    }
  }

  function detectSpeechDialect(text, defaultCode = 'en-IN'){
    if(!text) return defaultCode;
    if(/[\u0900-\u097F]/.test(text)) return 'hi-IN'; // Devanagari (Hindi, Marathi, Maithili)
    if(/[\u0980-\u09FF]/.test(text)) return 'bn-IN'; // Bengali, Assamese
    if(/[\u0B80-\u0BFF]/.test(text)) return 'ta-IN'; // Tamil
    if(/[\u0C00-\u0C7F]/.test(text)) return 'te-IN'; // Telugu
    if(/[\u0C80-\u0CFF]/.test(text)) return 'kn-IN'; // Kannada
    if(/[\u0D00-\u0D7F]/.test(text)) return 'ml-IN'; // Malayalam
    if(/[\u0A80-\u0AFF]/.test(text)) return 'gu-IN'; // Gujarati
    if(/[\u0A00-\u0A7F]/.test(text)) return 'pa-IN'; // Punjabi
    if(/[\u0B00-\u0B7F]/.test(text)) return 'or-IN'; // Odia
    if(/[\u0600-\u06FF]/.test(text)) return 'ur-IN'; // Urdu
    return defaultCode;
  }

  function speakLiveResponse(text){
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();

    const cleanText = stripForSpeech(text);
    const utterance = new SpeechSynthesisUtterance(cleanText);
    const langObj = LANGUAGES.find(l => l.code === selectedLang) || LANGUAGES[0];
    const dialectCode = detectSpeechDialect(cleanText, langObj.speechCode || 'en-IN');
    utterance.lang = dialectCode;

    const chosenVoice = pickBestVoice(dialectCode, selectedVoiceGender);
    if(chosenVoice){
      utterance.voice = chosenVoice;
    }

    utterance.onend = () => {
      setSpeakingIndex(null);
      if(liveVoiceRef.current){
        setLiveVoiceStatus('listening');
        setTimeout(()=>{
          if(liveVoiceRef.current) listenForLiveVoice();
        }, 500);
      } else {
        setLiveVoiceStatus('idle');
      }
    };

    utterance.onerror = () => {
      setSpeakingIndex(null);
      if(liveVoiceRef.current){
        setTimeout(()=>{
          if(liveVoiceRef.current) listenForLiveVoice();
        }, 500);
      }
    };

    window.speechSynthesis.speak(utterance);
  }

  /* Standard One-Time Mic Input */
  function startListening(){
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SpeechRecognition) return;
    const langObj = LANGUAGES.find(l => l.code === selectedLang) || LANGUAGES[0];
    
    const recognition = new SpeechRecognition();
    recognition.lang = langObj.speechCode || 'en-IN';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onresult = (e) => {
      const transcript = (e.results[0][0].transcript || '').trim();
      const wakeWords = ['hi sahayak', 'hello sahayak', 'hey sahayak', 'namaste sahayak', 'नमस्ते सहायक'];
      const hasWake = wakeWords.some(w => transcript.toLowerCase().includes(w));
      if(hasWake){
        startLiveVoice();
      } else {
        setInput(prev => prev ? `${prev} ${transcript}` : transcript);
      }
    };
    recognition.onerror = (e) => {
      setListening(false);
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        setMicError("Microphone access blocked. Please allow mic permission in your browser address bar.");
      } else {
        setMicError(`Voice error: ${e.error}`);
      }
    };
    recognition.onend = () => setListening(false);
    recognitionRef.current = recognition;
    setMicError(null);
    recognition.start();
    setListening(true);
  }

  function stopListening(){
    if(recognitionRef.current) recognitionRef.current.stop();
    setListening(false);
  }

                </button>
                <button className={`filter-pill worktax ${browseFilter==='worktax'?'active':''}`} onClick={()=>setBrowseFilter('worktax')}>
                  <Icon.briefcase s={14}/> EPFO, Tax &amp; Utilities ({CATEGORIES.filter(c=>c.type==='worktax').length})
                </button>
                <button className={`filter-pill voter ${browseFilter==='voter'?'active':''}`} onClick={()=>setBrowseFilter('voter')}>
                  <Icon.ballot s={14}/> Election &amp; Voter ({CATEGORIES.filter(c=>c.type==='voter').length})
                </button>
                <button className={`filter-pill grievance ${browseFilter==='grievance'?'active':''}`} onClick={()=>setBrowseFilter('grievance')}>
                  <Icon.doc s={14}/> Grievance &amp; RTI ({CATEGORIES.filter(c=>c.type==='grievance').length})
                </button>
              </div>

              <div className="category-grid">
                {CATEGORIES.filter(c => browseFilter === 'all' || c.type === browseFilter).map(cat => (
                  <div className="category-card" key={cat.id} onClick={()=>browseCategory(cat)}>
                    <div className="category-card-top">
                      <div className={`category-icon ${cat.type || 'scheme'}`}>{getIcon(cat.icon, {s:20})}</div>
                      <span className={`category-badge ${cat.type || 'scheme'}`}>
                        {cat.type === 'identity' ? 'Identity & Doc' :
                         cat.type === 'rto' ? 'RTO Transport' :
                         cat.type === 'eseva' ? 'e-Seva / Certificate' :
                         cat.type === 'worktax' ? 'EPFO, Tax & Utilities' :
                         cat.type === 'voter' ? 'Election' :
                         cat.type === 'grievance' ? 'Grievance / RTI' : 'Welfare'}
                      </span>
                    </div>
                    <div className="category-label">{cat.label}</div>
                    <div className="category-blurb">{cat.blurb}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        ) : view === 'directory' ? (
          /* View 2: All 28 States & 8 UTs Directory */
          <div className="chat-scroll">
            <div className="directory-container">
              <div className="directory-hero">
                <div>
                  <h2>Official Portals of All 28 States &amp; 8 UTs</h2>
                  <p>Direct official links for Grievance Redressal, RTI, e-District welfare services, and State Electoral Officers.</p>
                </div>
                <button className="new-chat-btn" style={{width:'auto', margin:0, whiteSpace:'nowrap'}} onClick={()=>setView('chat')}>
                  Ask Assistant →
                </button>
              </div>
              <div className="state-cards-grid">
                {STATES_DIRECTORY.map(s => (
                  <div className="state-card" key={s.code}>
                    <div className="state-card-header">
                      <span className="state-card-title">{s.name}</span>
                      <span className="state-badge">{s.type}</span>
                    </div>
                    <div className="state-links">
                      <div className="state-link-row">
                        <span>e-District / Services:</span>
                        <a href={`https://${s.schemesPortal}`} target="_blank" rel="noopener noreferrer">
                          {s.schemesPortal} <Icon.external s={11}/>
                        </a>
                      </div>
                      <div className="state-link-row">
                        <span>RTO Parivahan:</span>
                        <a href="https://parivahan.gov.in" target="_blank" rel="noopener noreferrer">
                          parivahan.gov.in <Icon.external s={11}/>
                        </a>
                      </div>
                      <div className="state-link-row">
                        <span>Grievance Portal:</span>
                        <a href={`https://${s.grievancePortal}`} target="_blank" rel="noopener noreferrer">
                          {s.grievancePortal} <Icon.external s={11}/>
                        </a>
                      </div>
                      <div className="state-link-row">
                        <span>RTI Portal:</span>
                        <a href={`https://${s.rtiPortal}`} target="_blank" rel="noopener noreferrer">
                          {s.rtiPortal} <Icon.external s={11}/>
                        </a>
                      </div>
                      <div className="state-link-row">
                        <span>Helpline:</span>
                        <span className="helpline-chip">{s.helpline}</span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        ) : (
          /* View 3: Chat Stream */
          <div className="chat-scroll" ref={logRef}>
            <div className="chat-inner">
              {messages.length === 0 && !pending && (
                <div className="empty-state">
                  <div className="empty-icon"><Icon.sparkle s={26}/></div>
                  <h2>{currentLangText.emptyHeading}</h2>
                  <p>{currentLangText.emptySub} State: <strong>{activeStateObj.name}</strong></p>
                  <div className="powered-badge">
                    <Icon.sparkle s={12}/> Engineered &amp; Powered by <strong>Suraj Yadav</strong>
                  </div>
                  <div className="suggestion-grid">
                    <div className="suggestion-card" onClick={()=>sendText(`I am a farmer in ${activeStateObj.name}, what central and state subsidies can I get?`)}>
                      <span className="suggestion-tag scheme">Welfare</span>
                      "What subsidies and schemes are available in {activeStateObj.name}?"
                    </div>
                    <div className="suggestion-card" onClick={()=>sendText(`How do I apply for a Learner's License and transfer vehicle RC in ${activeStateObj.name}?`)}>
                      <span className="suggestion-tag voter" style={{background:'rgba(20,80,163,0.12)', color:'var(--chakra)'}}>RTO Transport</span>
                      "How do I apply for a Learner's License &amp; RC transfer?"
                    </div>
                    <div className="suggestion-card" onClick={()=>sendText(`How do I apply for a Domicile and Caste Certificate in ${activeStateObj.name}?`)}>
                      <span className="suggestion-tag scheme" style={{background:'rgba(142,68,173,0.12)', color:'#8E44AD'}}>e-Seva Kendra</span>
                      "How do I get Domicile, Caste &amp; Income certificates?"
                    </div>
                    <div className="suggestion-card" onClick={()=>sendText(`My ration card or certificate application has been delayed for 2 months in ${activeStateObj.name}`)}>
                      <span className="suggestion-tag grievance">Grievance</span>
                      "My application is pending for 2 months in {activeStateObj.name}"
                    </div>
                  </div>
                </div>
              )}

              {messages.map((m, i) => (
                m.who === 'user' ? (
                  <div className="msg user" key={i}>
                    <div className="msg-avatar user"><Icon.user s={14}/></div>
                    <div className="msg-card">{m.text}</div>
                  </div>
                ) : (
                  <div className="msg" key={i}>
                    <div className="msg-avatar auto"><Icon.sparkle s={15}/></div>
                    <div className="msg-card">
                      <div dangerouslySetInnerHTML={renderMarkdown(m.text)} />
                      <div className="msg-card-bottom">
                        <Sources citations={m.citations} />
                        <div className="msg-actions-row">
                          <button
                            className={`card-action-btn ${copiedIndex===i?'copied':''}`}
                            onClick={()=>copyMessageText(i, m.text)}
                            title="Copy answer to clipboard"
                          >
                            {copiedIndex===i ? (
                              <React.Fragment><Icon.userCheck s={12}/> <span>Copied!</span></React.Fragment>
                            ) : (
                              <React.Fragment><Icon.doc s={12}/> <span>Copy</span></React.Fragment>
                            )}
                          </button>
                          {speechSupported && (
                            <button 
                              className={`speak-btn ${speakingIndex===i?'speaking':''}`} 
                              onClick={()=>toggleSpeak(i, m.text)} 
                              title={speakingIndex===i ? 'Stop reading' : 'Read aloud in selected language'}
                            >
                              {speakingIndex===i ? (
                                <React.Fragment><Icon.close s={12}/> <span>Stop</span></React.Fragment>
                              ) : (
                                <React.Fragment><Icon.speaker s={13}/> <span>Read Aloud</span></React.Fragment>
                              )}
                            </button>
                          )}
                        </div>
                      </div>
                    </div>
                  </div>
                )
              ))}

              {loading && (
                <div className="msg">
                  <div className="msg-avatar auto"><Icon.sparkle s={14}/></div>
                  <div className="typing-card">
                    <div className="typing-dot"></div><div className="typing-dot"></div><div className="typing-dot"></div>
                  </div>
                </div>
              )}
            </div>
          </div>
        )}

        {/* Composer */}
        <div className="composer">
          <div className="composer-inner">
            {micError && (
              <div className="mic-error">
                {micError}
                <button onClick={()=>setMicError(null)}><Icon.close s={11}/></button>
              </div>
            )}
            <div className="input-shell">
              <button
                className={`mic-btn ${listening && !liveVoiceActive ? 'listening' : ''}`}
                onClick={listening ? stopListening : startListening}
                title={speechRecSupported ? (listening ? 'Stop listening' : `Type by Voice in ${LANGUAGES.find(l=>l.code===selectedLang)?.label}`) : 'Speech recognition not supported'}
                disabled={!speechRecSupported}
              >
                <Icon.mic s={16}/>
              </button>
              <textarea
                placeholder={listening ? (liveVoiceActive ? "🎙️ Live Mode active... Speak naturally (Say 'Stop' to end)" : currentLangText.listening) : (liveVoiceActive ? "Live Voice ON... Speak or type your message" : currentLangText.placeholder)}
                value={input}
                onChange={e=>setInput(e.target.value)}
                onKeyDown={onKeyDown}
                rows={1}
              />
              <div className="composer-actions">
                {speechRecSupported && (
                  <button
                    className={`action-icon-btn ${liveVoiceActive ? 'live-active' : ''}`}
                    onClick={liveVoiceActive ? stopLiveVoice : startLiveVoice}
                    title={liveVoiceActive ? "Live Voice Active (Tap to stop)" : "Live Voice Agent: Continuous Hands-Free Mode (Say 'Hi Sahayak')"}
                    disabled={!speechRecSupported}
                  >
                    {liveVoiceActive ? <span className="live-dot-pulse"></span> : <Icon.radioLive s={16}/>}
                  </button>
                )}
                {speechSupported && (
                  <button
                    className={`action-icon-btn ${autoSpeak ? 'auto-speak-active' : 'auto-speak-muted'}`}
                    onClick={()=>setAutoSpeak(!autoSpeak)}
                    title={autoSpeak ? "Spoken Responses: ON (Assistant reads answers aloud)" : "Spoken Responses: MUTED (Silent voice mode - no reading aloud)"}
                    disabled={!speechSupported}
                  >
                    {autoSpeak ? <Icon.speaker s={16}/> : <Icon.speakerMute s={16}/>}
                  </button>
                )}
                <button className="send-btn" onClick={handleSend} disabled={loading || !input.trim()} title="Send message">
                  <Icon.send s={16}/>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </React.Fragment>
  );
}

function Sources({citations}){
  if(!citations || citations.length === 0) return null;
  return (
    <div className="sources-row">
      {citations.map((c,i)=>(
        <a key={i} className="source-chip" href={c.url} target="_blank" rel="noopener noreferrer" title={c.title || c.url}>
          {c.title || c.url}
        </a>
      ))}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
